server.address=0.0.0.0
server.port=${PORT:80}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.datasource.hikari.initialization-fail-timeout=10000
app.access.enabled=true
app.access.secure-cookie=true
app.demo.allow-reset=false
app.demo.seed=false
app.monitor.enabled=false
app.legacy-import.file=
