server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
# Standard SPRING_DATASOURCE_* environment variables override these properties.
# DATABASE_URL is retained only as an explicit PostgreSQL JDBC URL alias.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSLMODE:verify-full}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
app.demo-mode=${APP_DEMO_MODE:true}
app.demo.seed=${APP_SEED_SYNTHETIC_DATA:false}
app.demo.allow-reset=${APP_ALLOW_DEMO_RESET:false}
app.monitor.enabled=${MONITOR_SIMULATION_ENABLED:false}
app.monitor.cadence-ms=${MONITOR_CADENCE_MS:15000}
app.monitor.initial-delay-ms=${MONITOR_INITIAL_DELAY_MS:15000}
app.simulation.enabled=${SIMULATION_INGESTION_ENABLED:false}
app.simulation.key=${SIMULATION_API_KEY:}
app.simulation.max-batch=${SIMULATION_MAX_BATCH:250}
app.simulation.max-bytes=${SIMULATION_MAX_BYTES:262144}
server.error.include-message=never
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

app.simulation.bindings=${SIMULATION_BINDINGS:}

app.legacy-import.file=${LEGACY_IMPORT_FILE:}

logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=WARN

spring.datasource.hikari.schema=${DB_SCHEMA:achillea}
spring.flyway.default-schema=${DB_SCHEMA:achillea}
spring.flyway.schemas=${DB_SCHEMA:achillea}

spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
