server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/achillea}
spring.sql.init.mode=always
app.demo-mode=${APP_DEMO_MODE:true}
# Comma-separated census patient IDs to assign to the demo nurse (external simulator), default none.
app.demo.assign-patients=${APP_DEMO_ASSIGN_PATIENTS:}
# census = full synthetic demo; simulator = only the simulator's 5 ICU patients and devices, no seeded records.
# Applies when a database is first created (or reset).
app.demo.seed=${APP_DEMO_SEED:census}
app.monitor.enabled=${MONITOR_SIMULATION_ENABLED:true}
app.monitor.cadence-ms=${MONITOR_CADENCE_MS:15000}
app.monitor.initial-delay-ms=${MONITOR_INITIAL_DELAY_MS:15000}
debug=false
server.error.include-message=always
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
